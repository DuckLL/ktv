<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTV Player</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/player_layout.css">
</head>
<body class="player-page">
  <div class="player-layout">

    <!-- Header -->
    <header class="player-header">
      <a class="mobile-back mobile-only" href="/" aria-label="返回歌曲庫">‹</a>
      <a class="player-logo" href="/">🎤 KTV</a>
      <div class="player-song">
        <span class="player-title" id="playerTitle"></span>
        <span class="player-artist" id="playerArtist"></span>
      </div>
      <button class="mobile-mv-toggle" id="mobileMvToggle" aria-label="收起 MV" aria-pressed="true"><span class="mv-toggle-short">MV</span><span class="mv-toggle-detail">顯示 MV</span></button>
      <a class="youtube-link" id="youtubeLink" target="_blank" rel="noopener noreferrer" aria-label="在 YouTube 開啟原影片" title="在 YouTube 開啟原影片" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
        </svg>
        <span class="video-action-label">YouTube</span>
      </a>
      <button class="mobile-adjust mobile-only" id="mobileSettingsOpen" aria-label="練唱調整" aria-haspopup="dialog" aria-controls="mobileSettings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span class="mobile-settings-label">調整</span>
      </button>
    </header>

    <!-- Main: video + lyrics -->
    <main class="player-main">
      <section class="mv-stage has-mv" id="mvStage" aria-label="影片與播放">
      <div class="video-wrap">
        <video id="mainVideo" controls playsinline></video>
      </div>
      <div id="mobilePlaybackStatus" role="status" aria-live="polite"></div>
      </section>

      <div class="video-controls">
        <div class="lyric-navigation" aria-label="播放跳轉">
          <button class="navigation-btn" id="previousLine" aria-label="快退 5 秒"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M5 5h2v14H5zm3 7 11-7v14z"/></svg><span id="previousLineLabel">← 退 5 秒</span></button>
          <span class="navigation-label" id="navigationLabel">播放跳轉</span>
          <button class="navigation-btn" id="nextLine" aria-label="快進 5 秒"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7-11 7z"/></svg><span id="nextLineLabel">進 5 秒 →</span></button>
        </div>
        <span class="kbd-hint" id="keyboardHint">← → 前後 5 秒　↑ ↓ 音量</span>
      </div>

      <details class="playback-settings" id="playbackSettings" open>
        <summary class="panel-summary">
          <span>音量、導唱與升降 key</span>
          <span class="panel-preview" id="audioSettingsSummary">音量 80% · 伴唱</span>
          <span class="panel-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="mix-settings">
          <label class="volume-control" for="volumeSlider">
            <span class="volume-label">音量</span>
            <input
              class="volume-slider"
              id="volumeSlider"
              type="range"
              min="0"
              max="100"
              step="1"
              value="80"
              aria-label="主音量"
            >
            <span class="volume-value" id="volumeValue" aria-live="polite">80%</span>
          </label>
          <div class="key-control">
            <label for="keySelect">升降 key</label>
            <div class="key-stepper">
            <button class="mobile-only key-step" id="mobileKeyDown" aria-label="降低半音">−</button>
            <select id="keySelect" aria-label="歌曲升降 key，每格半音，速度不變">
              <option value="-6">−6 半音</option>
              <option value="-5">−5 半音</option>
              <option value="-4">−4 半音</option>
              <option value="-3">−3 半音</option>
              <option value="-2">−2 半音</option>
              <option value="-1">−1 半音</option>
              <option value="0" selected>原調</option>
              <option value="1">+1 半音</option>
              <option value="2">+2 半音</option>
              <option value="3">+3 半音</option>
              <option value="4">+4 半音</option>
              <option value="5">+5 半音</option>
              <option value="6">+6 半音</option>
            </select>
            <button class="mobile-only key-step" id="mobileKeyUp" aria-label="升高半音">+</button>
            </div>
          </div>
          <div class="audio-toggle" aria-label="音軌混音">
            <button class="audio-toggle-btn active" id="btnInstrumental">🎵 伴唱</button>
            <label class="mix-control" for="vocalMixSlider">
              <input
                class="mix-slider"
                id="vocalMixSlider"
                type="range"
                min="0"
                max="100"
                step="1"
                value="0"
                aria-label="人聲混音比例"
              >
              <span class="mix-value" id="vocalMixValue">0%</span>
            </label>
            <button class="audio-toggle-btn" id="btnOriginal">🎤 原唱</button>
          </div>
        </div>
      </details>
      <div class="audio-status" id="audioStatus" role="status" aria-live="polite">音訊載入中…</div>
      <div class="audio-status" id="keyStatus" role="status" aria-live="polite"></div>
      <details class="pitch-panel" id="pitchPanel">
        <summary class="panel-summary">
          <span>音準練習</span>
          <span class="panel-preview">目標音高 × 你的音高</span>
          <span class="panel-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="pitch-content">
          <div class="pitch-toolbar">
            <button class="pitch-mic-button" id="pitchMicToggle" type="button" disabled>開啟麥克風</button>
            <label class="pitch-octave-control" for="pitchOctaveToggle" title="音準目標比目前歌曲的 key 低一個八度">
              <input id="pitchOctaveToggle" type="checkbox" role="switch">
              低八度演唱
            </label>
            <label class="practice-select" for="pitchTolerance">容錯
              <select id="pitchTolerance">
                <option value="practice" selected>練習 ±80 音分／120 ms</option>
                <option value="relaxed">寬鬆 ±100 音分／180 ms</option>
                <option value="strict">精準 ±50 音分／50 ms</option>
              </select>
            </label>
            <label class="practice-select" for="pitchSensitivity">收音
              <select id="pitchSensitivity">
                <option value="normal">一般</option>
                <option value="quiet">輕聲</option>
                <option value="noisy">抗雜音</option>
              </select>
            </label>
            <span class="pitch-legend"><i class="pitch-legend-reference"></i> 目標 <i class="pitch-legend-singer"></i> 你</span>
            <span class="pitch-result" id="pitchResult">尚無可比對片段</span>
          </div>
          <canvas id="pitchCanvas" class="pitch-canvas" role="img" aria-label="目標與你的即時音高曲線"></canvas>
          <div class="pitch-notes" aria-label="目前音高">
            <span>目標 <strong id="pitchTargetNote">—</strong></span>
            <span>你 <strong id="pitchSungNote">—</strong></span>
          </div>
          <p class="practice-hint" id="pitchTempo"></p>
          <div class="pitch-footer">
            <span id="pitchStatus">音高資料載入中…</span>
            <label for="pitchDelaySlider">收音延遲校正
              <input id="pitchDelaySlider" type="range" min="-300" max="600" step="10" value="0">
              <span id="pitchDelayValue">0 ms</span>
            </label>
          </div>
        </div>
      </details>
      <section class="mobile-live-sound mobile-only" id="mobileLiveSound" aria-label="播放聲音調整">
        <div id="mobileMixSettings"></div>
      </section>
      <div class="desktop-functional-controls desktop-only" id="desktopLyricSettings"></div>
      <div class="mobile-lyric-settings mobile-only" id="mobileLyricSettings" aria-label="歌詞時間差"></div>
      <section class="lyrics-workspace" id="lyricsWorkspace" aria-label="完整歌詞與跳轉">
        <div class="lyric-rail" id="mobilePreviousRail"></div>
        <div class="lyrics-stage" id="lyricsStage">
          <div class="lyrics-placeholder">載入歌詞中…</div>
        </div>
        <div class="lyric-rail" id="mobileNextRail"></div>
      </section>
      <div class="desktop-functional-controls desktop-only" id="desktopPitchSettings"></div>
      <section class="mobile-pitch-card" id="mobilePitchCard" aria-label="原唱與你的音高">
        <div class="mobile-pitch-head" id="mobilePitchHead"><span id="mobilePitchLabel">原唱音高</span></div>
        <p class="mobile-pitch-message" id="mobilePitchMessage" role="status"></p>
      </section>

      <!-- Lyrics time offset controls -->
      <details class="offset-settings" id="offsetSettings" open>
        <summary class="panel-summary">
          <span>歌詞時間差</span>
          <span class="panel-preview" id="offsetSummary">+0.00 s</span>
          <span class="panel-chevron" aria-hidden="true">⌄</span>
        </summary>
        <h3 class="mobile-section-title">歌詞時間差</h3>
        <div class="offset-bar" id="offsetBar">
          <span class="offset-label">歌詞時間差</span>
          <button class="offset-btn" id="offsetMinus" data-offset-step="-0.5">−0.5s</button>
          <button class="offset-btn" id="offsetFineMinus" data-offset-step="-0.2">−0.2s</button>
          <span class="offset-value" id="offsetValue">0.00 s</span>
          <button class="offset-btn" id="offsetFinePlus" data-offset-step="0.2">+0.2s</button>
          <button class="offset-btn" id="offsetPlus" data-offset-step="0.5">+0.5s</button>
          <button class="offset-btn reset" id="offsetReset">重置</button>
          <span class="offset-saved" id="offsetSaved">已儲存</span>
        </div>
      </details>
    </main>

    <!-- Sidebar: lyrics search -->
    <aside class="sidebar">
      <details class="lyrics-search-panel" id="lyricsSearchPanel" open>
        <summary class="sidebar-header panel-summary">
          <span>歌詞搜尋</span>
          <span class="panel-preview" id="lyricsSelectionSummary">尚未選擇</span>
          <span class="panel-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="sidebar-content">
          <p class="lyrics-auto-status" id="lyricsAutoStatus" role="status" aria-live="polite"></p>
          <div class="sidebar-search">
            <input
              class="sidebar-input"
              id="lyricsSearchInput"
              type="text"
              placeholder="歌手 歌名…"
              autocomplete="off"
            >
            <button class="sidebar-btn" id="lyricsSearchBtn">搜尋</button>
          </div>
          <button class="lyrics-auto-button" id="lyricsAutoRetry" type="button">重新自動找歌詞</button>
          <div class="results-list" id="resultsList">
            <div class="no-results">輸入關鍵字後按搜尋</div>
          </div>
        </div>
      </details>
    </aside>

    <aside class="settings-sidebar" id="desktopSettings" aria-label="聲音與歌詞版本">
      <div class="desktop-functional-controls desktop-only" id="desktopSoundSettings" role="group" aria-label="聲音設定"><h3 class="desktop-sound-title">聲音</h3></div>
    </aside>

  </div>

  <dialog class="mobile-settings" id="mobileSettings" aria-labelledby="mobileSettingsTitle">
    <div class="mobile-sheet-handle" aria-hidden="true"></div>
    <div class="player-settings-content" id="playerSettingsContent">
    <div class="mobile-sheet-head"><h2 id="mobileSettingsTitle">練唱調整</h2><button class="mobile-only" id="mobileSettingsClose" aria-label="關閉調整">×</button></div>
    <div class="mobile-settings-tabs" role="tablist" aria-label="設定分類">
      <button id="mobileTabSound" role="tab" aria-controls="mobileSoundPanel" aria-selected="true" data-tab="sound">播放</button>
      <button id="mobileTabLyrics" role="tab" aria-controls="mobileLyricsPanel" aria-selected="false" tabindex="-1" data-tab="lyrics">歌詞</button>
      <button id="mobileTabPitch" role="tab" aria-controls="mobilePitchPanel" aria-selected="false" tabindex="-1" data-tab="pitch">音準</button>
    </div>
    <section class="mobile-settings-panel" id="mobileSoundPanel" role="tabpanel" aria-labelledby="mobileTabSound"><h3 class="settings-section-title desktop-only">聲音</h3><div class="mobile-video-actions" id="mobileVideoActions" role="group" aria-label="影片操作"></div></section>
    <section class="mobile-settings-panel" id="mobileLyricsPanel" role="tabpanel" aria-labelledby="mobileTabLyrics" hidden>
      <div class="mobile-lyric-version"><div>歌詞版本<small id="mobileVersionName">尚未選擇</small></div><div class="lyric-version-actions"><button id="mobileChangeLyrics" aria-controls="lyricsSearchPanel" aria-expanded="false">更換</button><button id="lyricsClearMemory" title="清除此歌曲的歌詞版本與時間差記憶" disabled>清除記憶</button></div></div>
    </section>
    <section class="mobile-settings-panel" id="mobilePitchPanel" role="tabpanel" aria-labelledby="mobileTabPitch" hidden>
      <h3 class="settings-section-title desktop-only">音準設定</h3>
      <label class="mobile-chart-toggle" for="mobilePitchVisible">顯示音高圖<input id="mobilePitchVisible" type="checkbox" role="switch" checked></label>
      <details class="mobile-pitch-advanced" id="mobilePitchAdvanced"><summary>進階設定</summary><div class="pitch-advanced-content" id="pitchAdvancedContent"></div></details>
    </section>
    </div>
  </dialog>

  <script type="module" src="/static/js/player.js"></script>
</body>
</html>
